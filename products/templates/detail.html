{% extends 'base.html' %}

{% block content %}
<h1>{{ product.name }}</h1>

<img src="{{ product.image_url }}" alt="{{ product.name }}" width="300">

<p>Price: {{ product.price }}</p>
<p>Stock: {{ product.stock }}</p>

<a href="{% url 'products' %}">Back to products</a>
<a href="#" class="btn btn-primary">Add to Cart</a>
{% endblock %}
